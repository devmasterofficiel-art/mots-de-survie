<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulaire essentiel multilingue</title>
<style>
  :root {
    --c1: #0057b7;
    --c2: #ffd500;
    --scale: 1;
    --ink: #1d2433;
    --muted: #5e6679;
    --line: rgba(29, 36, 51, .10);
    --card: rgba(255, 255, 255, .86);
    --card-solid: #ffffff;
    --head: color-mix(in srgb, var(--c1) 8%, #ffffff);
    --sub: color-mix(in srgb, var(--c1) 6%, #f4f6fb);
    --bar: rgba(255, 255, 255, .78);
    --tab: rgba(255, 255, 255, .55);
    --input: #ffffff;
    --en: #b42c3c;
    --fr: #2a4fb8;
    --tg: color-mix(in srgb, var(--c1) 85%, #000000);
    --phrase-bg: color-mix(in srgb, var(--c2) 12%, #fffdf5);
    --bg1: color-mix(in srgb, var(--c1) 22%, #eef2f9);
    --bg2: color-mix(in srgb, var(--c2) 25%, #f7f3ea);
    --bg-base: #eef1f7;
    --shadow: 0 6px 24px rgba(20, 30, 60, .08);
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --ink: #e6e9f2;
    --muted: #9aa3b8;
    --line: rgba(255, 255, 255, .09);
    --card: rgba(24, 28, 40, .82);
    --card-solid: #181c28;
    --head: color-mix(in srgb, var(--c1) 18%, #1c2130);
    --sub: color-mix(in srgb, var(--c1) 12%, #1a1f2c);
    --bar: rgba(16, 19, 28, .80);
    --tab: rgba(255, 255, 255, .06);
    --input: #11141d;
    --en: #ff8a96;
    --fr: #8fb0ff;
    --tg: color-mix(in srgb, var(--c1) 55%, #ffffff);
    --phrase-bg: color-mix(in srgb, var(--c2) 9%, #1d2130);
    --bg1: color-mix(in srgb, var(--c1) 35%, #0b0e16);
    --bg2: color-mix(in srgb, var(--c2) 22%, #0b0e16);
    --bg-base: #0b0e16;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { font-size: calc(16px * var(--scale)); }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
    font-size: 1rem;
    color: var(--ink);
    line-height: 1.45;
    min-height: 100vh;
    background:
      radial-gradient(1100px 700px at 0% 0%, var(--bg1), transparent 65%),
      radial-gradient(900px 700px at 100% 30%, var(--bg2), transparent 60%),
      radial-gradient(900px 600px at 30% 100%, var(--bg1), transparent 60%),
      var(--bg-base);
    background-attachment: fixed;
    transition: background-color .3s, color .3s;
  }
  header {
    border-top: 5px solid var(--c1);
    border-image: linear-gradient(90deg, var(--c1) 0 50%, var(--c2) 50% 100%) 1;
  }
  .header-inner {
    background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 14%, transparent), transparent);
    padding: 26px 24px 0;
    text-align: center;
  }
  h1 {
    margin: 0 0 4px; font-size: 2.1rem; letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--tg), color-mix(in srgb, var(--c2) 70%, var(--tg)));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { margin: 0 0 18px; color: var(--muted); }

  /* ---------- Onglets ---------- */
  .tabs {
    display: flex; gap: 4px; justify-content: center; flex-wrap: wrap;
    max-width: 1400px; margin: 0 auto; padding: 0 8px;
  }
  .tab {
    border: 1px solid var(--line); border-bottom: 0;
    background: var(--tab); color: var(--muted);
    padding: 8px 11px; border-radius: 10px 10px 0 0;
    font-size: 0.88rem; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    backdrop-filter: blur(6px);
    transition: background .15s, color .15s;
  }
  .tab:hover { color: var(--ink); background: var(--card); }
  .tab .flag { font-size: 1.15rem; line-height: 1; }
  .tab.active {
    background: var(--bar); color: var(--tab-c, var(--c1));
    box-shadow: inset 0 3px 0 var(--tab-c, var(--c1));
    position: relative; top: 1px;
  }
  html[data-theme="dark"] .tab.active { color: color-mix(in srgb, var(--tab-c) 55%, #ffffff); }

  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bar);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 12px 24px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
  }
  .toolbar input[type="search"] {
    flex: 1 1 260px; max-width: 380px;
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.95rem;
    background: var(--input); color: var(--ink);
  }
  .toolbar select {
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.95rem;
    background: var(--input); color: var(--ink);
  }
  .toolbar label { font-size: 0.9rem; color: var(--muted); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .group { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .group button {
    border: 0; background: var(--input); color: var(--ink);
    padding: 8px 11px; font-size: 0.95rem; font-weight: 700; cursor: pointer; min-width: 40px;
  }
  .group button + button { border-left: 1px solid var(--line); }
  .group button:hover { background: var(--sub); }
  .btn-pdf {
    padding: 9px 16px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--c1); color: #fff; font-weight: 600; font-size: 0.95rem;
  }
  .btn-pdf:hover { filter: brightness(1.1); }

  main { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .count { text-align: center; color: var(--muted); font-size: 0.9rem; margin: 0 0 18px; }

  section.cat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 22px;
    overflow: hidden;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
  }
  section.cat h2 {
    margin: 0; padding: 12px 16px;
    font-size: 1.1rem;
    border-bottom: 1px solid var(--line);
    background: var(--head);
    border-left: 4px solid var(--c1);
  }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th {
    text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: .06em;
    padding: 8px 14px; border-bottom: 2px solid var(--line);
  }
  th.en { color: var(--en); }
  th.fr { color: var(--fr); }
  th.tg { color: var(--tg); }
  td {
    padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top;
    word-wrap: break-word;
  }
  tbody tr:not(.sub):hover td { background: color-mix(in srgb, var(--c1) 6%, transparent); }
  tr:last-child td { border-bottom: 0; }
  td.tg .main { display: block; font-weight: 700; color: var(--tg); font-style: normal; }
  td.tg .native { display: block; font-weight: 400; font-size: 0.86rem; color: var(--muted); font-style: normal; }
  td.tg .native[dir="rtl"] { font-size: 1.05rem; text-align: right; }
  body.no-native td.tg .native { display: none; }
  tr.sub td {
    background: var(--sub); font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); padding: 6px 14px;
  }
  tr.phrase td { background: var(--phrase-bg); font-style: italic; }
  .speak {
    float: right; margin: -2px 0 0 6px;
    border: 1px solid var(--line); background: var(--input); border-radius: 6px;
    width: 2rem; height: 1.8rem; cursor: pointer; font-size: 0.9rem; line-height: 1;
    font-style: normal;
  }
  .speak:hover { background: var(--sub); }
  .speak.playing { background: #ffd500; border-color: #e0bb00; }
  .voice-info {
    display: none; max-width: 1400px; margin: 14px auto 0; padding: 10px 14px;
    background: #fff6d6; color: #4a3d00; border: 1px solid #f0d97a; border-radius: 8px; font-size: 0.9rem;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; display: none; }

  footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 10px 24px 40px; }

  @media (max-width: 640px) {
    td, thead th { padding: 7px 8px; font-size: 0.88rem; }
    h1 { font-size: 1.5rem; }
    .tabs { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; justify-content: flex-start; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; padding: 8px 10px; }
  }

  /* ---------- Impression / PDF : toujours clair, seulement la langue active ---------- */
  @page { size: A4; margin: 14mm 12mm; }
  .print-title { display: none; }
  @media print {
    html { font-size: 16px; }
    html, html[data-theme="dark"] {
      --ink: #1d2433; --muted: #5e6679; --line: #d5d9e2; --card: #fff; --head: #eef1f7; --sub: #f1f3f8;
      --en: #b42c3c; --fr: #2a4fb8; --tg: var(--c1); --phrase-bg: #fbf8ec; color-scheme: light;
    }
    body { background: #fff; font-size: 10.5pt; }
    header { border: 0; }
    .header-inner { padding: 0 0 8px; background: none; }
    h1, .subtitle, .tabs { display: none; }
    .print-title { display: block; font-size: 17pt; margin: 0 0 8px; text-align: center; color: #1d2433; }
    .toolbar, .count, .voice-info, .speak, footer .screen-only { display: none !important; }
    main { padding: 0; max-width: none; }
    section.cat { border: 1px solid #ccc; border-radius: 0; margin-bottom: 10px; break-inside: auto; box-shadow: none; backdrop-filter: none; }
    section.cat h2 { padding: 6px 10px; font-size: 12pt; break-after: avoid; }
    thead { display: table-header-group; }
    tr { break-inside: avoid; }
    td, thead th { padding: 4px 8px; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
<script>
/* Thème et taille appliqués avant l'affichage (évite le flash blanc) */
(function () {
  var theme = null, scale = null;
  try { theme = localStorage.getItem("vocab-theme"); scale = localStorage.getItem("vocab-scale"); } catch (e) {}
  if (!theme) theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", theme);
  if (scale) document.documentElement.style.setProperty("--scale", scale);
})();
</script>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Vocabulaire essentiel</h1>
    <p class="subtitle">Les mots et phrases les plus utiles en anglais, en français et dans la langue de ton choix</p>
    <p class="print-title" id="printTitle"></p>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="Rechercher un mot…">
  <select id="category"></select>
  <label id="nativeToggle"><input type="checkbox" id="showNative" checked> Écriture originale</label>
  <label><input type="checkbox" id="showPhrases" checked> Phrases d'exemple</label>
  <label>Vitesse
    <select id="rate">
      <option value="0.75">Lente</option>
      <option value="1" selected>Normale</option>
      <option value="1.2">Rapide</option>
    </select>
  </label>
  <div class="group" title="Taille du texte">
    <button type="button" id="zoomOut" aria-label="Réduire le texte">A−</button>
    <button type="button" id="zoomIn" aria-label="Agrandir le texte">A+</button>
  </div>
  <div class="group">
    <button type="button" id="themeBtn" title="Mode jour / nuit">🌙</button>
  </div>
  <button class="btn-pdf" id="btnPdf" type="button">⬇ PDF de cette langue</button>
</div>
<p class="voice-info" id="voiceInfo"></p>

<main>
  <p class="count" id="count"></p>
  <div id="content"></div>
  <p class="empty" id="empty">Aucun résultat.</p>
</main>

<footer>
  <p>(m) = masculin · (f) = féminin. <span id="footerNote"></span></p>
  <p class="screen-only"><span id="voiceNote"></span> Pour le PDF : dans la fenêtre d’impression, choisis « Enregistrer au format PDF ».</p>
</footer>

</script>
<script>
/* ---------- Données ---------- */
// BASE : catégories avec en/fr par défaut ; chaque langue a ses textes (tg), sa prononciation (pron)
// et quelques phrases anglaises/françaises adaptées (ov).
const contentEl = document.getElementById("content");
const searchEl = document.getElementById("search");
const categoryEl = document.getElementById("category");
const nativeEl = document.getElementById("showNative");
const phrasesEl = document.getElementById("showPhrases");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const rateEl = document.getElementById("rate");
const voiceInfoEl = document.getElementById("voiceInfo");
const tabsEl = document.getElementById("tabs");

let current = null;

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function normalize(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

function rowsFor(lang) {
  return BASE.map(c => ({
    title: c.title,
    words: c.words.map(r => buildRow(r, lang)),
    phrases: c.phrases.map(r => buildRow(r, lang))
  }));
}

function buildRow(r, lang) {
  const ov = lang.ov[r.i];
  return {
    i: r.i,
    en: ov ? ov[0] : r.en,
    fr: ov ? ov[1] : r.fr,
    tg: lang.tg[r.i],
    pron: lang.pron ? lang.pron[r.i] : null
  };
}

/* Les voix sont dans audio/xx.js, chargées seulement quand on ouvre la langue
   (balise <script>, donc ça marche aussi en local / hors ligne, sans serveur). */
window.AUDIO_DATA = window.AUDIO_DATA || {};
const audioLoading = {};

function loadAudio(lang) {
  if (!lang.hasAudio) return Promise.resolve({});
  if (window.AUDIO_DATA[lang.code]) return Promise.resolve(window.AUDIO_DATA[lang.code]);
  if (!audioLoading[lang.code]) {
    audioLoading[lang.code] = new Promise(resolve => {
      const s = document.createElement("script");
      s.src = "audio/" + lang.code + ".js";
      s.onload = () => resolve(window.AUDIO_DATA[lang.code] || {});
      s.onerror = () => { delete audioLoading[lang.code]; resolve(null); };
      document.head.appendChild(s);
    });
  }
  return audioLoading[lang.code];
}

/* ---------- Onglets ---------- */
tabsEl.innerHTML = LANGS.map(l =>
  `<button class="tab" type="button" data-code="${l.code}" style="--tab-c:${l.c1}">
     <span class="flag">${l.flag}</span>${escapeHtml(l.fr)}
   </button>`).join("");

tabsEl.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) selectLang(tab.dataset.code);
});

let DATA = [];
let ROWS = [];

function selectLang(code) {
  const lang = LANGS.find(l => l.code === code) || LANGS[0];
  current = lang;
  stopAll();
  voiceInfoEl.style.display = "none";

  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.code === lang.code));
  const activeTab = tabsEl.querySelector(".tab.active");
  if (activeTab) tabsEl.scrollLeft = activeTab.offsetLeft - (tabsEl.clientWidth - activeTab.offsetWidth) / 2;
  document.documentElement.style.setProperty("--c1", lang.c1);
  document.documentElement.style.setProperty("--c2", lang.c2);
  document.getElementById("nativeToggle").style.display = lang.pron ? "" : "none";
  document.getElementById("footerNote").textContent = lang.footer;
  document.getElementById("voiceNote").textContent = lang.voiceNote;
  document.getElementById("printTitle").textContent = "Vocabulaire essentiel : " + lang.fr + " (" + lang.native + ")";
  document.title = "Vocabulaire essentiel : " + lang.fr;

  DATA = rowsFor(lang);
  ROWS = [];
  DATA.forEach(c => [...c.words, ...c.phrases].forEach(r => { ROWS[r.i] = r; }));

  try { localStorage.setItem("vocab-lang", lang.code); } catch (e) {}
  if (location.hash !== "#" + lang.code) history.replaceState(null, "", "#" + lang.code);
  render();
  loadAudio(lang);
}

/* ---------- Affichage ---------- */
categoryEl.innerHTML = `<option value="all">Toutes les catégories</option>` +
  BASE.map((c, i) => `<option value="${i}">${escapeHtml(c.title)}</option>`).join("");

function speakBtn(lang, i) {
  return `<button class="speak" type="button" data-lang="${lang}" data-i="${i}" title="Écouter">🔊</button>`;
}

function targetCell(row) {
  const dir = current.rtl ? ' dir="rtl"' : "";
  if (row.pron) {
    return `<span class="main">${escapeHtml(row.pron)}</span><span class="native"${dir}>${escapeHtml(row.tg)}</span>`;
  }
  return `<span class="main"${dir}>${escapeHtml(row.tg)}</span>`;
}

function rowHtml(row, cls) {
  return `<tr class="${cls}">
    <td class="en">${speakBtn("en", row.i)}${escapeHtml(row.en)}</td>
    <td class="fr">${speakBtn("fr", row.i)}${escapeHtml(row.fr)}</td>
    <td class="tg">${speakBtn("tg", row.i)}${targetCell(row)}</td>
  </tr>`;
}

function render() {
  const q = normalize(searchEl.value.trim());
  const cat = categoryEl.value;
  const withPhrases = phrasesEl.checked;
  const match = r => !q || [r.en, r.fr, r.tg, r.pron || ""].some(t => normalize(t).includes(q));

  let html = "";
  let nbWords = 0;
  let nbPhrases = 0;

  DATA.forEach((c, i) => {
    if (cat !== "all" && String(i) !== cat) return;
    const words = c.words.filter(match);
    const phrases = withPhrases ? c.phrases.filter(match) : [];
    if (!words.length && !phrases.length) return;

    nbWords += words.length;
    nbPhrases += phrases.length;

    html += `<section class="cat">
      <h2>${escapeHtml(c.title)}</h2>
      <table>
        <thead><tr><th class="en">🇬🇧 English</th><th class="fr">🇫🇷 Français</th><th class="tg">${current.flag} ${escapeHtml(current.fr)} (${escapeHtml(current.native)})</th></tr></thead>
        <tbody>
          ${words.length ? `<tr class="sub"><td colspan="3">Mots</td></tr>` + words.map(w => rowHtml(w, "word")).join("") : ""}
          ${phrases.length ? `<tr class="sub"><td colspan="3">Phrases d’exemple</td></tr>` + phrases.map(p => rowHtml(p, "phrase")).join("") : ""}
        </tbody>
      </table>
    </section>`;
  });

  contentEl.innerHTML = html;
  emptyEl.style.display = html ? "none" : "block";
  countEl.textContent = `${nbWords} mots · ${nbPhrases} phrases`;
}

/* ---------- Lecture vocale ---------- */
let voices = [];
let currentAudio = null;

function loadVoices() {
  if ("speechSynthesis" in window) voices = speechSynthesis.getVoices();
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function pickVoice(lang) {
  const list = voices.filter(v => v.lang.replace("_", "-").toLowerCase().startsWith(lang));
  if (!list.length) return null;
  return list.find(v => /natural|neural|online|premium|enhanced/i.test(v.name))
      || list.find(v => /google/i.test(v.name))
      || list[0];
}

function cleanForSpeech(text) {
  return text.replace(/\((m|f)\)/g, "").replace(/…/g, "").replace(/^\d+,\s/, "")
             .replace(/\s\/\s/g, ", ").replace(/\s+/g, " ").trim();
}

function stopAll() {
  if (currentAudio) currentAudio.pause();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  document.querySelectorAll(".speak.playing").forEach(b => b.classList.remove("playing"));
}

async function playTarget(row, btn) {
  const lang = current;
  btn.textContent = "⏳";
  const data = await loadAudio(lang);
  btn.textContent = "🔊";
  if (lang !== current) return;
  if (data === null) {
    voiceInfoEl.textContent = "⚠️ Impossible de charger les voix (le dossier « audio » doit être à côté de la page). La voix de l’appareil est utilisée à la place.";
    voiceInfoEl.style.display = "block";
  }
  const clip = data ? data[row.i] : null;
  if (!clip) { playBrowser(lang.code, row.tg, btn); return; }
  currentAudio = new Audio("data:audio/mpeg;base64," + clip);
  currentAudio.playbackRate = parseFloat(rateEl.value);
  btn.classList.add("playing");
  currentAudio.onended = currentAudio.onerror = () => btn.classList.remove("playing");
  currentAudio.play().catch(() => btn.classList.remove("playing"));
}

function playBrowser(lang, text, btn) {
  const voice = "speechSynthesis" in window ? pickVoice(lang) : null;
  if (!voice) {
    const name = lang === "fr" ? "française" : lang === "en" ? "anglaise" : current.adj;
    voiceInfoEl.textContent = "⚠️ Aucune voix " + name + " n’est installée sur cet appareil (réglages de synthèse vocale de Windows / Android / iPhone).";
    voiceInfoEl.style.display = "block";
    return;
  }
  const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
  u.voice = voice;
  u.lang = voice.lang;
  u.rate = parseFloat(rateEl.value) * 0.85;
  btn.classList.add("playing");
  u.onend = u.onerror = () => btn.classList.remove("playing");
  speechSynthesis.speak(u);
}

contentEl.addEventListener("click", e => {
  const btn = e.target.closest(".speak");
  if (!btn) return;
  stopAll();
  const row = ROWS[btn.dataset.i];
  if (btn.dataset.lang === "tg") {
    playTarget(row, btn);
  } else {
    playBrowser(btn.dataset.lang, btn.dataset.lang === "en" ? row.en : row.fr, btn);
  }
});

searchEl.addEventListener("input", render);
categoryEl.addEventListener("change", render);
phrasesEl.addEventListener("change", render);
nativeEl.addEventListener("change", () => {
  document.body.classList.toggle("no-native", !nativeEl.checked);
});

document.getElementById("btnPdf").addEventListener("click", () => {
  searchEl.value = "";
  categoryEl.value = "all";
  phrasesEl.checked = true;
  render();
  window.print();
});

/* ---------- Taille du texte et mode jour / nuit ---------- */
const root = document.documentElement;
const themeBtn = document.getElementById("themeBtn");

function currentScale() {
  return parseFloat(getComputedStyle(root).getPropertyValue("--scale")) || 1;
}

function setScale(s) {
  s = Math.min(1.8, Math.max(0.8, Math.round(s * 100) / 100));
  root.style.setProperty("--scale", s);
  try { localStorage.setItem("vocab-scale", s); } catch (e) {}
}

function updateThemeBtn() {
  const dark = root.getAttribute("data-theme") === "dark";
  themeBtn.textContent = dark ? "☀️" : "🌙";
  themeBtn.title = dark ? "Passer en mode jour" : "Passer en mode nuit";
}

document.getElementById("zoomIn").addEventListener("click", () => setScale(currentScale() + 0.1));
document.getElementById("zoomOut").addEventListener("click", () => setScale(currentScale() - 0.1));
themeBtn.addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("vocab-theme", next); } catch (e) {}
  updateThemeBtn();
});
updateThemeBtn();

/* ---------- Démarrage : langue de l'URL (#es), sinon la dernière utilisée ---------- */
let start = location.hash.slice(1);
if (!LANGS.some(l => l.code === start)) {
  try { start = localStorage.getItem("vocab-lang"); } catch (e) { start = null; }
}
selectLang(start || LANGS[0].code);
</script>
</body>
